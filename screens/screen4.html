button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Anime</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Apps</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Books</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Games</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Movies</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Music</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">18+ Series</button><button class="flex-shrink-0 px-3 py-1 rounded-full bg-[#0D1117] text-gray-400 border border-[#1F2937] hover:border-acid/50 hover:text-white font-pixel text-[9px] font-medium transition-colors active:scale-95">Others</button></div></div><div class="space-y-2.5 pt-1"><article class="bg-[#0D1117] rounded-xl border border-[#1F2937] p-3.5 flex items-center justify-between gap-3 hover:border-[#283547] transition-all"><div x items-center gap-2 mb-0.5"><span class="px-1.5 py-0.5 rounded bg-[#161D28] text-gray-300 font-pixel text-[8px] border border-[#222B38]">LINUX</span><h3 class="font-mono font-bold text-white text-[13px] leading-snug truncate tracking-tight">Arch Linux 2025.02 Minimal</h3></div><div class="flex items-center gap-2 text-[11px] font-mono mt-1 text-gray-400"><span class="text-white font-medium">912 MB</span><span class="text-subtle">•</span><span class="text-cyan font-bold">↓ 2,910</span><span class="text-acid font-bold">↑ 180</span></div></div><button class="flex-shrink-0 px-3 py-1.5 rounded-lg bg-[#161D28] text-gray-200 border border-[#222B38] hover:border-acid hover:text-acid font-pixel text-[9px] font-bold active:scale-95 transition-all flex items-center gap-1">+ Add</button></article><article class="bg-[#0D1117] rounded-xl border border-[#1F2937] p-3.5 flex items-center justify-between gap-3 hover:border-[#283547] transition-all"><div class="min-w-0 flex-1"><div class="flex items-center gap-2 mb-0.5"><span class="px-1.5 py-0.5 rounded bg-[#161D28] text-gray-300 font-pixel text-[8px] border border-[#222B38]">MOVIES</span><h3 class="font-mono font-bold text-white text-[13px] leading-snug truncate tracking-tight">Sintel 4K Remaster [CC-BY]</h3></div><div class="flex items-center gap-2 text-[11px] font-mono mt-1 text-gray-400"><span class="text-white font-medium">5.1 GB</span><span class="text-subtle">•</span><span class="text-cyan font-bold">↓ 850</span><span class="text-acid font-bold">↑ 42</span></div></div><button class="flex-shrink-0 px-3 py-1.5 rounded-lg bg-[#161D28] text-gray-200 border border-[#222B38] hover:border-acid hover:text-acid font-pixel text-[9px] font-bold active:scale-95 transition-all flex items-center gap-1">+ Add</button></article></div></main>
<!-- Floating Action Button (FAB) [+ MAGNET] with Chunky 8-bit Pixel Cross -->
<div class="fixed bottom-20 right-0 left-0 max-w-[412px] mx-auto px-4 flex justify-end z-40 pointer-events-none">
<button class="pointer-events-auto w-12 h-12 rounded-xl bg-acid text-black flex items-center justify-center hover:bg-[#d6ff33] active:scale-95 transition-all border border-[#efff80]" title="Add Torrent / Magnet">
<!-- Chunky 8-bit pixelated plus (+) icon -->
<svg class="w-6 h-6 pixelated-render fill-black" viewbox="0 0 12 12">
<rect height="9" width="3" x="4.5" y="1.5"></rect>
<rect height="3" width="9" x="1.5" y="4.5"></rect>
</svg>
</button>
</div>

<nav class="fixed bottom-0 left-0 right-0 max-w-[412px] mx-auto bg-[#070A0E]/95 backdrop-blur-md border-t border-[#161C26] px-2 py-2 flex items-center justify-between z-30"><button class="flex-1 flex flex-col items-center gap-1 group py-0.5 opacity-60 hover:opacity-100 transition-opacity"><span class="material-symbols-outlined text-[20px] text-gray-400 group-hover:text-white">swap_vert</span><span class="font-pixel text-[7.5px] text-gray-400 group-hover:text-white tracking-tight">TRANSFERS</span></button><button class="flex-1 flex flex-col items-center gap-1 group py-0.5"><div class="relative flex items-center justify-center"><span class="material-symbols-outlined text-[20px] text-acid">search</span><span class="absolute -top-0.5 -right-1 w-1.5 h-1.5 rounded-full bg-acid shadow-neon-lime"></span></div><span class="font-pixel text-[7.5px] text-acid font-bold tracking-tight">SEARCH</span></button><button class="flex-1 flex flex-col items-center gap-1 group py-0.5 opacity-60 hover:opacity-100 transition-opacity"><span class="material-symbols-outlined text-[20px] text-gray-400 group-hover:text-white">rss_feed</span><span class="font-pixel text-[7.5px] text-gray-400 group-hover:text-white tracking-tight">FEEDS</span></button><button class="flex-1 flex flex-col items-center gap-1 group py-0.5 opacity-60 hover:opacity-100 transition-opacity"><span class="material-symbols-outlined text-[20px] text-gray-400 group-hover:text-white">tune</span><span class="font-pixel text-[7.5px] text-gray-400 group-hover:text-white tracking-tight">CONFIG</span></button></nav>
