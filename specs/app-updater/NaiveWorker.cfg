\* expect: fail OneDownloadAtATime
\* module: AppUpdater
\* The background job downloads on its own, without the lock the app uses.
CONSTANTS
  DESIGN = "naiveWorker"
SPECIFICATION Spec
INVARIANTS
  TypeOK
  NeverInstallUnverified
  ForeignNeverDownloads
  ManagedNeverDownloads
  NoMeteredAutoDownload
  OneDownloadAtATime
  RestoreNeverSkipsVerify
  EveryStateHasAnExit
