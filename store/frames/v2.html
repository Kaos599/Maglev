<!doctype html>
<html><head><meta charset="utf-8"><title>Frame v2</title>
<link rel="stylesheet" href="frame.css">
<style>
  /* v2: caption on top in Inter ExtraBold, white with one lime phrase (*...* in screens.v2.json),
     near-white supporting line, then the phone at the same size and crop on every frame. */
  @font-face { font-family: 'InterX'; font-weight: 800; src: url('../../node_modules/@expo-google-fonts/inter/800ExtraBold/Inter_800ExtraBold.ttf'); }
  /* The caption block is centred in the space above the phone, so one- and two-line headlines sit alike. */
  .text { position: absolute; left: 80px; right: 80px; top: 0; height: 470px; padding-bottom: 12px; display: flex; flex-direction: column; justify-content: center; }
  .headline { font-family: 'InterX', sans-serif; font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -3px; color: #F3F4F6; }
  .headline .lime { color: var(--lime); }
  .subline { font-family: 'Inter', sans-serif; font-size: 42px; line-height: 1.3; letter-spacing: -0.4px; color: #D1D7DE; margin-top: 24px; text-wrap: balance; }
  .phone { left: 100px; width: 880px; top: 470px; }
</style></head>
<body>
<div class="grid"></div>
<div class="text"><h1 class="headline"></h1><p class="subline"></p></div>
<div class="phone"><img class="screen" alt=""></div>
<script src="frame.js"></script>
</body></html>
