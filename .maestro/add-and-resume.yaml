# Add a magnet, let it start, kill the process, relaunch, expect it listed and downloading again.
appId: com.maglev
name: add-and-resume
---
- runFlow: subflows/onboard-if-needed.yaml
- openLink: "magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fopen.tracker.cl%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.openbittorrent.com%3A6969%2Fannounce&tr=udp%3A%2F%2Fexplodie.org%3A6969%2Fannounce"
- extendedWaitUntil:
    visible: "Start download.*"
    timeout: 120000
- tapOn: "Start download.*"
- extendedWaitUntil:
    visible: ".*, [1-9][0-9]* percent"
    timeout: 180000
- pressKey: Home
- killApp
- launchApp
- extendedWaitUntil:
    visible: ".*percent.*"
    timeout: 45000
- extendedWaitUntil:
    visible: "Pause .*"
    timeout: 90000
- runFlow: subflows/remove-all-with-files.yaml
