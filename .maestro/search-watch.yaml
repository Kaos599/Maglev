# Watch a search, check it is listed under Settings, Watches, then delete it.
# If "Sintel" is already watched, the Watch tap shows "You are already watching that." and the flow still continues.
appId: com.maglev
name: search-watch
---
- runFlow: subflows/onboard-if-needed.yaml
- tapOn: "Search"
- tapOn:
    text: "Search torrents"
- inputText: "Sintel"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Add .*"
    timeout: 90000
- tapOn:
    text: "Watch this search|Watch"
- extendedWaitUntil:
    visible: "Watching \"Sintel\""
    timeout: 10000
- tapOn: "Settings"
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Watches"
- extendedWaitUntil:
    visible: "Sintel"
    timeout: 15000
# Per-row testID targets the "Sintel" watch directly even if an earlier run left another watch above it.
- tapOn:
    id: "watch-delete-Sintel"
- extendedWaitUntil:
    visible: "Delete this watch\\?"
    timeout: 10000
# The in-app Dialog has a dedicated testID on its Delete button so it cannot match the card behind it.
- tapOn:
    id: "watch-delete-confirm"
- extendedWaitUntil:
    notVisible: "Sintel"
    timeout: 10000
