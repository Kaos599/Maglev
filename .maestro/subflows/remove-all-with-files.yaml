# Cleanup: removes the one transfer on screen and deletes its files.
# Cards carry testID "transfer-card" (components/TransferCard.tsx). Never match on "percent":
# the status bar battery reads "Battery charging, 85 percent." and matches any percent regex.
appId: com.maglev
---
- extendedWaitUntil:
    visible:
      id: "transfer-card"
    timeout: 30000
- longPressOn:
    id: "transfer-card"
- tapOn: "Delete selected"
- tapOn: "Remove and delete files"
- tapOn: "Delete files|Delete [0-9.]+ (B|KB|MB|GB|TB)"
- extendedWaitUntil:
    notVisible:
      id: "transfer-card"
    timeout: 30000
