# Change three settings in three groups, kill the app, relaunch, and check they persisted. Then restore the defaults.
# Defaults after onboarding: fontStyle "clean" (constants/copy.ts fontStyleCopy), network.wifiOnly TRUE (onboarding pre-selects Wi-Fi only; the store default is false),
# bandwidth.downloadPreset "UNLIMITED" (context/SettingsContext.tsx).
# Settings rows are reached with subflows/open-settings-row.yaml (the list is long and keeps its scroll). Pages are left with the in-app "Go back".
# The font change is made LAST in each phase: in the 0.28 CI run a hardware Back right after changing the font style left the app
# (the live font change rebuilds the theme and the navigation stack), so nothing navigates after it until the relaunch.
appId: com.maglev
name: settings-roundtrip
---
- runFlow: subflows/onboard-if-needed.yaml
- tapOn: "Settings"
# Maestro applies "checked" BEFORE "index": only the switch is ever checked, so assert on it without an index (index 1 only works for taps and unfiltered matches).
# Wi-Fi only is ON after onboarding (app/onboarding.tsx pre-selects it), so the round trip turns it OFF, checks it survives, then turns it back ON.
# 1. Network > Wi-Fi only: a Toggle labelled "Wi-Fi only" (app/settings/network.tsx). The row title is also "Wi-Fi only", so index 1 is the switch.
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Network"
- extendedWaitUntil:
    visible: "Wi-Fi only"
    timeout: 20000
- tapOn:
    text: "Wi-Fi only"
    index: 1
- assertNotVisible:
    text: "Wi-Fi only"
    checked: true
- tapOn: "Go back"
# 2. Speed and sharing > Download limit: ChipGroup chip "2 MB/s" (components/settings/SpeedSection.tsx). The same chip is in the Upload limit group, so index 0 is the download group.
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Speed and sharing"
- extendedWaitUntil:
    visible: "Download limit"
    timeout: 20000
- tapOn:
    text: "2 MB/s"
    index: 0
- assertVisible:
    text: "2 MB/s"
    index: 0
    selected: true
- tapOn: "Go back"
# 3. Appearance > Font: a RadioCard labelled "<title>. <description>" (app/settings/interface.tsx)
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Appearance"
- extendedWaitUntil:
    visible: "Font"
    timeout: 20000
- tapOn: "Retro\\..*"
- assertVisible:
    text: "Retro\\..*"
    checked: true
# Kill the process and relaunch. Persistence goes through the settings store, not the screen.
- stopApp
- launchApp
- runFlow:
    file: subflows/wait-for-app.yaml
    env:
      TEXT: "Get started|Transfers"
- tapOn: "Settings"
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Network"
- extendedWaitUntil:
    visible: "Wi-Fi only"
    timeout: 20000
- assertNotVisible:
    text: "Wi-Fi only"
    checked: true
# Restore the default (ON) now (no font change has been made yet in this phase)
- tapOn:
    text: "Wi-Fi only"
    index: 1
- assertVisible:
    text: "Wi-Fi only"
    checked: true
- tapOn: "Go back"
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Speed and sharing"
- extendedWaitUntil:
    visible: "Download limit"
    timeout: 20000
- assertVisible:
    text: "2 MB/s"
    index: 0
    selected: true
- tapOn:
    text: "Unlimited"
    index: 0
- tapOn: "Go back"
- runFlow:
    file: subflows/open-settings-row.yaml
    env:
      ROW: "Appearance"
- extendedWaitUntil:
    visible: "Font"
    timeout: 20000
- assertVisible:
    text: "Retro\\..*"
    checked: true
- tapOn: "Clean\\..*"
- assertVisible:
    text: "Clean\\..*"
    checked: true
