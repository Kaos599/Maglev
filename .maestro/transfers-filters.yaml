# The Transfers filter pills and the name filter change what is shown, then reset.
# Pills: components/FilterPills.tsx and components/transfers/model.ts:9-16. A Chip with a count is labelled "<label>, <count>" (components/ui/Chip.tsx:29).
# Empty copy: constants/copy.ts empty.transfers.noneInFilter ("No done transfers").
appId: com.maglev
name: transfers-filters
---
- runFlow: subflows/onboard-if-needed.yaml
- openLink: "magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fopen.tracker.cl%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.openbittorrent.com%3A6969%2Fannounce&tr=udp%3A%2F%2Fexplodie.org%3A6969%2Fannounce"
- extendedWaitUntil:
    visible: "Start download.*"
    timeout: 120000
- tapOn: "Start download.*"
# from app/add-torrent.tsx:499
- extendedWaitUntil:
    visible:
      id: "transfer-card"
    timeout: 60000
# testID "transfer-card": components/TransferCard.tsx:179
- tapOn: "Downloading, [0-9]+"
# Filter pill with count: components/ui/Chip.tsx:29
- assertVisible:
    id: "transfer-card"
- tapOn: "Done, [0-9]+"
- assertVisible: "No done transfers"
# Empty filter title: constants/copy.ts empty.transfers.noneInFilter; shown by app/(tabs)/index.tsx:626-643
- assertNotVisible:
    id: "transfer-card"
- tapOn: "All, [0-9]+"
- assertVisible:
    id: "transfer-card"
# Name filter: IconButton "Filter transfers by name" (app/(tabs)/index.tsx:555)
- tapOn: "Filter transfers by name"
- tapOn: "Filter by name"
# TextInput placeholder: app/(tabs)/index.tsx:570
- inputText: "zzz-no-such-title"
- assertVisible: "No matching transfers"
# empty.transfers.noMatch.title (constants/copy.ts)
- tapOn: "Clear filter text"
# IconButton: app/(tabs)/index.tsx:578
- inputText: "sintel"
- assertVisible:
    id: "transfer-card"
- tapOn: "Close filter"
# Closes the name filter and clears its text: app/(tabs)/index.tsx:555
- assertVisible:
    id: "transfer-card"
# Sort: IconButton "Sort transfers" (app/(tabs)/index.tsx:552), sheet title "Sort by" (components/transfers/SortSheet.tsx:20)
- tapOn: "Sort transfers"
- assertVisible: "Sort by"
- tapOn: "Progress"
# Sort label: components/transfers/model.ts:18-27. Choosing a row closes the sheet (SortSheet.tsx:36-39).
- assertVisible:
    id: "transfer-card"
- tapOn: "Sort transfers"
- assertVisible: "Sort by"
- tapOn: "Date added"
# Reset to the default sort (utils/prefs/transfers.ts DEFAULT_SORT: added, desc). Its direction is set by the segmented control; desc is the default.
- assertVisible:
    id: "transfer-card"
- runFlow: subflows/remove-all-with-files.yaml
