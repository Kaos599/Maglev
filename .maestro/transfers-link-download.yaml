# Add a direct https link, wait for progress above 0, pause, resume, then clean up.
# The file is Blender Foundation's Sintel trailer (CC BY 3.0), about 4 MB.
# Selectors: "Add a link or torrent" = components/FloatingActionButton.tsx:14 (default accessibilityLabel).
#   "Type a link" = components/add/AddMenuSheet.tsx:46 (copy: constants/copy.ts addMenu.typeHint row title).
#   "Link, magnet or .torrent" = app/add-torrent.tsx:604. Routes https links to app/add-download.tsx (add-torrent.tsx:168).
#   "Start" = app/add-download.tsx:316. Card name = probe file name, so anchor on "sintel_trailer-480p\\.mp4".
#   Pause/Resume icon labels = components/transfers/DownloadCard.tsx:101 (`${action.label} ${d.name}`).
appId: com.maglev
name: transfers-link-download
---
- runFlow: subflows/onboard-if-needed.yaml
- tapOn:
    text: "Add a link or torrent"
    # from components/FloatingActionButton.tsx:14
- tapOn: "Type a link"
# from components/add/AddMenuSheet.tsx:46
- tapOn: "Link, magnet or .torrent"
# from app/add-torrent.tsx:604
- inputText: "https://download.blender.org/durian/trailer/sintel_trailer-480p.mp4"
- tapOn: "Get info"
# from app/add-torrent.tsx:618
- extendedWaitUntil:
    visible: "Start"
    timeout: 60000
# from app/add-download.tsx:316 (ready phase, after the probe)
- tapOn: "Start"
- extendedWaitUntil:
    visible: "sintel_trailer-480p\\.mp4, .*"
    timeout: 30000
# Card label: "<name>, <status>, ..." (components/transfers/DownloadCard.tsx:67)
- extendedWaitUntil:
    visible: "sintel_trailer-480p\\.mp4, [1-9][0-9]* percent.*"
    timeout: 120000
# Progress above 0 only, never completion. The name anchor keeps other rows (battery, status bar) out.
- tapOn: "Pause sintel_trailer-480p\\.mp4"
# from components/transfers/DownloadCard.tsx:101
- extendedWaitUntil:
    visible: "Resume sintel_trailer-480p\\.mp4"
    timeout: 30000
- tapOn: "Resume sintel_trailer-480p\\.mp4"
- extendedWaitUntil:
    visible: "Pause sintel_trailer-480p\\.mp4"
    timeout: 60000
- longPressOn: "sintel_trailer-480p\\.mp4, .*"
- tapOn: "Delete selected"
# from components/transfers/BulkBar.tsx:23 (`${label} selected`)
- tapOn: "Remove and delete files"
# from components/transfers/DeleteSheet.tsx:47
- tapOn: "Delete files|Delete [0-9.]+ (B|KB|MB|GB|TB)"
# from components/transfers/DeleteSheet.tsx:36, size from utils/format
- extendedWaitUntil:
    notVisible: "sintel_trailer-480p\\.mp4, .*"
    timeout: 30000
- assertVisible: "Nothing downloading"
# empty.transfers.none.title, constants/copy.ts:(empty.transfers.none), components/transfers/TeachingEmptyState.tsx:49
