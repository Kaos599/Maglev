# Ad blocking in the Browser: the per-site switch in Site settings and the global "Ad blocking" setting
# (app/browser.tsx, app/settings/browser-blocking.tsx).
# Test page: https://test-videos.co.uk/bigbuckbunny/mp4-h264 (no ads expected, so the "N blocked" count is not asserted).
appId: com.maglev
name: browser-blocking
---
- runFlow: subflows/onboard-if-needed.yaml
- openLink: "maglev://browser?url=https%3A%2F%2Ftest-videos.co.uk%2Fbigbuckbunny%2Fmp4-h264"
- extendedWaitUntil:
    visible: "Address"
    timeout: 30000
# Wait for the page host to load before opening the ⋮ menu and Site settings.
- extendedWaitUntil:
    visible: ".*test-videos\\.co\\.uk.*"
    timeout: 60000
- tapOn: "More"
- tapOn: "Site settings"
# The Ads toggle "Block ads on this site" is on by default. Its title and the switch share the label, so index 1 is the switch.
- extendedWaitUntil:
    visible: "Block ads on this site"
    timeout: 30000
- tapOn:
    text: "Block ads on this site"
    index: 1
- extendedWaitUntil:
    visible: "Ads allowed on .*"
    timeout: 15000
- tapOn: "More"
- tapOn: "Site settings"
- tapOn:
    text: "Block ads on this site"
    index: 1
- extendedWaitUntil:
    visible: "Blocking ads on .*"
    timeout: 15000
- tapOn: "More"
- tapOn: "Browser settings"
- extendedWaitUntil:
    visible: "Blocking"
    timeout: 30000
- tapOn: "Blocking"
- extendedWaitUntil:
    visible: "Ad blocking"
    timeout: 30000
# Global switch (app/settings/browser-blocking.tsx). The Toggle shares accessibilityLabel "Ad blocking" with the row title, so index 1 picks the switch.
- tapOn:
    text: "Ad blocking"
    index: 1
- tapOn: "Go back"
- tapOn: "Go back"
- tapOn: "More"
# With ad blocking off the Ads section of Site settings is hidden.
- tapOn: "Site settings"
- extendedWaitUntil:
    visible: "Pop-ups and redirects"
    timeout: 15000
- assertNotVisible: "Block ads on this site"
- pressKey: Back
- tapOn: "More"
- tapOn: "Browser settings"
- extendedWaitUntil:
    visible: "Blocking"
    timeout: 30000
- tapOn: "Blocking"
- extendedWaitUntil:
    visible: "Ad blocking"
    timeout: 30000
# Turn it back on so the next run starts from the default.
- tapOn:
    text: "Ad blocking"
    index: 1
- tapOn: "Go back"
- tapOn: "Go back"
- tapOn: "More"
- tapOn: "Site settings"
- assertVisible: "Block ads on this site"
- pressKey: Back
