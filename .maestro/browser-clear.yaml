# Find files on a public test page, remove one item from the tray, and clear the rest.
# Test page: Big Buck Bunny (CC BY 3.0, direct MP4 links).
# Nothing is downloaded here, so there is no transfer to clean up.
appId: com.maglev
name: browser-clear
---
- runFlow: subflows/onboard-if-needed.yaml
- openLink: "maglev://browser?url=https%3A%2F%2Ftest-videos.co.uk%2Fbigbuckbunny%2Fmp4-h264"
- extendedWaitUntil:
    visible: "Address"
    timeout: 30000
- extendedWaitUntil:
    visible: "Files . [1-9][0-9]*"
    timeout: 90000
- tapOn: "Files . [1-9][0-9]*"
- extendedWaitUntil:
    visible: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
    timeout: 30000
# A small media file (under 1 MiB) can be hidden by "Hide small files": show them when the tray says so.
- runFlow:
    when:
      visible: "Show [0-9]+ hidden small files"
    commands:
      - tapOn: "Show [0-9]+ hidden small files"
# Remove one item: each row has a Remove button labelled "Remove <name> from the list".
- tapOn: "Remove Big_Buck_Bunny_360_10s_1MB\\.mp4 from the list"
# The row label has ", " after the name; the Undo line "Removed <name>." does not, so it does not count as the row.
- assertNotVisible: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
- assertVisible: ".*Big_Buck_Bunny_360_10s_2MB\\.mp4, .*"
# Clear all: button "Clear" with accessibilityLabel "Clear the list of found files". No confirmation, an Undo line appears.
- tapOn: "Clear the list of found files"
- assertVisible: "No files found yet"
