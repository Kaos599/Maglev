# Find files on a public test page, remove one, clear the rest, then check that the list resets on the next page.
# Test pages (Big Buck Bunny and Jellyfish, CC BY 3.0, direct MP4 links, checked with curl).
# Nothing is downloaded here, so there is no transfer to clean up.
appId: com.maglev
name: browser-clear
---
- runFlow: subflows/onboard-if-needed.yaml
- openLink: "maglev://browser?url=https%3A%2F%2Ftest-videos.co.uk%2Fbigbuckbunny%2Fmp4-h264"
- extendedWaitUntil:
    visible: "Address" # app/browser.tsx:268
    timeout: 30000
- extendedWaitUntil:
    visible: "Files . [1-9][0-9]*" # app/browser.tsx:344 "Files · N"
    timeout: 90000
- tapOn: "Files . [1-9][0-9]*" # app/browser.tsx:800 opens FoundTray
- extendedWaitUntil:
    visible: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*" # FoundTray.tsx row label "<name>, <meta>"
    timeout: 30000
# A small media file (under 1 MiB) can be hidden by "Hide small files" (foundFilter.ts SMALL_MEDIA_BYTES): show them when the tray says so.
- runFlow:
    when:
      visible: "Show [0-9]+ hidden small files"
    commands:
      - tapOn: "Show [0-9]+ hidden small files"
# Remove one item: each row has a Remove button labelled "Remove <name> from the list" (foundTray.remove, constants/copy.ts).
- tapOn: "Remove Big_Buck_Bunny_360_10s_1MB\\.mp4 from the list"
# The row label has ", " after the name; the Undo line "Removed <name>." does not, so it does not count as the row.
- assertNotVisible: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
- assertVisible: ".*Big_Buck_Bunny_360_10s_2MB\\.mp4, .*" # another file is still listed
# Clear all: button "Clear" with accessibilityLabel "Clear the list of found files" (foundTray.clearLabel). No confirmation, an Undo line appears.
- tapOn: "Clear the list of found files"
- assertVisible: "No files found yet" # constants/copy.ts empty.browser.noFiles.title (FoundTray.tsx)
# Close the tray and open the next page via deep link (avoids racing the address bar editor).
- pressKey: Back
- openLink: "maglev://browser?url=https%3A%2F%2Ftest-videos.co.uk%2Fjellyfish%2Fmp4-h264"
- extendedWaitUntil:
    visible: "Files . [1-9][0-9]*"
    timeout: 90000
- tapOn: "Files . [1-9][0-9]*" # app/browser.tsx:800, reopen the tray after loading the new page
# NEW: depends on found-files size/clear change. Navigating does not reset the list yet (mergeFound keeps old items).
- assertNotVisible: ".*Big_Buck_Bunny.*"
- extendedWaitUntil:
    visible: ".*Jellyfish.*" # files from the new page only
    timeout: 90000
