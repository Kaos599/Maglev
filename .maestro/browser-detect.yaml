# Open the Browser on a public test page with direct MP4 links, see the Files list with sizes,
# download one file, find it in Transfers, then remove it and its files.
# Test page: https://test-videos.co.uk/bigbuckbunny/mp4-h264 (Big Buck Bunny, CC BY 3.0).
appId: com.maglev
name: browser-detect
---
- runFlow: subflows/onboard-if-needed.yaml
# maglev://browser?url= loads the page in a new tab (utils/browserUrl.ts browserIntentRoute).
- openLink: "maglev://browser?url=https%3A%2F%2Ftest-videos.co.uk%2Fbigbuckbunny%2Fmp4-h264"
- extendedWaitUntil:
    visible: "Address"
    timeout: 30000
# Found-files indicator: "Files · N", accessibilityLabel "Files, N found".
- extendedWaitUntil:
    visible: "Files . [1-9][0-9]*"
    timeout: 90000
- tapOn: "Files . [1-9][0-9]*"
- assertVisible: "Files"
# A small media file (under 1 MiB) can be hidden by "Hide small files": show them when the tray says so.
- runFlow:
    when:
      visible: "Show [0-9]+ hidden small files"
    commands:
      - tapOn: "Show [0-9]+ hidden small files"
# Each row shows a size or "—" in its meta line.
- assertVisible: ".*(KB|MB|GB|—).*"
# Row label is "<name>, <size> · <host>". Tap opens FoundDownloadSheet.
- tapOn: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
# Name, size and folder sheet. Start enables after the probe.
- extendedWaitUntil:
    visible: "Start"
    timeout: 60000
- tapOn: "Start"
- extendedWaitUntil:
    visible: "Added to Transfers."
    timeout: 30000
# Leave the browser stack screen (it covers the tabs). Bounded to 5 presses so Back never loops forever.
- repeat:
    times: 5
    while:
      notVisible: "Transfers"
    commands:
      - pressKey: Back
- assertVisible: "Transfers"
- tapOn: "Transfers"
# A browser download is a link download, so it renders as DownloadCard, which has no "transfer-card"
# testID (only torrents' TransferCard does): match by name, as transfers-link-download.yaml does.
- extendedWaitUntil:
    visible: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
    timeout: 120000
# remove-all-with-files.yaml waits for id "transfer-card", which this card does not have, so the steps are spelled out.
- longPressOn: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
- tapOn: "Delete selected"
- tapOn: "Remove and delete files"
- tapOn: "Delete files|Delete [0-9.]+ (B|KB|MB|GB|TB)"
- extendedWaitUntil:
    notVisible: ".*Big_Buck_Bunny_360_10s_1MB\\.mp4, .*"
    timeout: 30000
