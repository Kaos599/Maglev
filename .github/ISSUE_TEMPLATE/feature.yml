name: Feature request
description: Something Maglev should do that it doesn't.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the "What's next" list in the README first. It may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, not the solution. "I want to download a whole season at once" works better than "add a button".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: With Maglev or another app, if at all.
  - type: textarea
    id: idea
    attributes:
      label: Your idea, if you have one
  - type: textarea
    id: states
    attributes:
      label: What states does it move through?
      description: Optional. The steps the feature goes through and what moves it along, including what happens if you leave the app or Android closes it. A list is fine.
      placeholder: |
        Downloading → you tap Pause → Paused
        Paused → you tap Resume → Downloading
        Downloading → Wi-Fi drops and "Wi-Fi only" is on → Waiting for Wi-Fi
        Android closes Maglev while Downloading → what should happen?
