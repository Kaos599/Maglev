name: Pages

# Publishes site/ to GitHub Pages. The HTML is committed output of site/build/build-site.mjs, so CI runs no build.
# Pushes to main that touch site/, lists/ or this file deploy; ci.yml runs on these pushes too (its own paths filter).
# The same deploy also builds the self-hosted F-Droid repo at /fdroid/repo from release APKs
# (scripts/build-fdroid-repo.sh). Releases are created with GITHUB_TOKEN, which never fires `release` events,
# so the repo refreshes when the release workflow completes, plus once a day as a fallback.
on:
  push:
    branches: [main]
    paths: ['site/**', 'lists/**', '.github/workflows/pages.yml', 'scripts/build-fdroid-repo.sh', 'fastlane/**']
  workflow_run:
    workflows: ["Build and Release Android APK"]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Static checks only (FAQ text matches its JSON-LD, links resolve); no browser, no npm install.
      - name: Check site
        run: node site/build/verify.mjs

      # The generator and its checker stay in the repo, not on the site.
      - name: Stage site without build sources
        run: rsync -a --exclude build/ site/ _site/

      # Signs lists/sources.json (docs/NATIVE_CONTRACT.md section 31.1) and publishes it at /lists/. Skipped without the
      # LISTS_SIGNING_KEY secret (an ECDSA P-256 private key, PEM): nothing is published and apps keep what they have.
      # The key goes to RUNNER_TEMP, never under _site, and is deleted right after signing.
      - name: Sign source lists
        env:
          LISTS_SIGNING_KEY: ${{ secrets.LISTS_SIGNING_KEY }}
        if: env.LISTS_SIGNING_KEY != ''
        run: |
          set -euo pipefail
          umask 077
          KEY="$RUNNER_TEMP/lists-signing-key.pem"
          printf '%s\n' "$LISTS_SIGNING_KEY" > "$KEY"
          openssl dgst -sha256 -sign "$KEY" -out "$RUNNER_TEMP/sources.sig" lists/sources.json
          mkdir -p _site/lists
          cp lists/sources.json _site/lists/sources.json
          base64 -w0 "$RUNNER_TEMP/sources.sig" > _site/lists/sources.json.sig
          rm -f "$KEY" "$RUNNER_TEMP/sources.sig"

      # Skipped until the three FDROID_* secrets exist, so the site keeps deploying without them.
      - name: Build F-Droid repo
        env:
          FDROID_KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          GH_TOKEN: ${{ github.token }}
        if: env.FDROID_KEYSTORE_B64 != ''
        run: scripts/build-fdroid-repo.sh _site/fdroid/repo

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages sometimes lists artifacts before a large upload (the F-Droid APKs make it ~300 MB) is visible
      # and fails with "No artifacts named github-pages". Wait, then try once more.
      - name: Deploy to GitHub Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the deploy
        if: steps.first.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
