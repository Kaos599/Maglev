name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
      - '*beta*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-android:
    name: Rust Android
    uses: ./.github/workflows/_rust-android.yml

  build-apk:
    name: Build Android APK
    needs: rust-android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          pattern: jniLibs-*
          merge-multiple: true
          path: modules/maglev-engine/android/src/main/jniLibs

      - name: Verify jniLibs layout
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "modules/maglev-engine/android/src/main/jniLibs/$abi/libmaglev_core.so" \
              || { echo "Missing $abi/libmaglev_core.so"; find modules/maglev-engine/android/src/main/jniLibs -type f; exit 1; }
          done

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Copy & Name APKs
        run: |
          mkdir -p build-artifacts
          TAG="${{ github.ref_name }}"
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            src="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            test -f "$src" || { echo "Missing $src"; ls -R android/app/build/outputs/apk/release; exit 1; }
            cp "$src" "build-artifacts/Maglev-${TAG}-${abi}.apk"
          done
          ls -lh build-artifacts

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Maglev ${{ github.ref_name }}
          body: |
            # Maglev ${{ github.ref_name }}

            Android BitTorrent client (pre-release: engine still in development).

            ### Which APK?
            * Most phones: `arm64-v8a`.
            * Older 32-bit phones: `armeabi-v7a`.
            * Not sure: `universal` (larger, works everywhere).
            * `x86_64` is for emulators and Chromebooks.

            ### Install
            1. Download one APK from the Assets list below.
            2. Open it on your Android device to install.
            3. Allow notifications so downloads keep running in the background.
          files: |
            build-artifacts/Maglev-${{ github.ref_name }}-universal.apk
            build-artifacts/Maglev-${{ github.ref_name }}-arm64-v8a.apk
            build-artifacts/Maglev-${{ github.ref_name }}-armeabi-v7a.apk
            build-artifacts/Maglev-${{ github.ref_name }}-x86_64.apk
          draft: false
          prerelease: true
