name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
      - '*beta*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Name APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Maglev-v0.1-beta.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v0.1-beta' }}
          name: Maglev v0.1-beta
          body: |
            # Maglev v0.1-beta — Native-Speed Android BitTorrent Client
            
            Ultra-fast, zero-bloat Android BitTorrent client powered by **React Native**, **Expo (SDK 58)**, and **Rust (`librqbit`)**.
            
            ### Installation
            1. Download **`Maglev-v0.1-beta.apk`** from the Assets list below.
            2. Open the downloaded APK on your Android device to install.
            3. Grant notification & storage permissions when prompted.
            
            ### Included in this Release
            * **Rust Engine Core:** Cross-compiled `libmaglev_core.so` (ARM64, ARMv7, x86_64).
            * **Cyber-Retro UI:** True OLED black (`#05070A`) & Electric Lime (`#CCFF00`) with tactile >= 44x44px touch targets.
            * **Full Protocol Parity:** Multi-file selection, priority controls (`HIGH`, `NORMAL`, `SKIP`), clipboard magnet detection, and in-flight sequential media streaming to VLC.
            * **Search & Feeds:** In-app public swarm search and automated RSS release monitoring.
            * **System Governance:** Wi-Fi only, SSID whitelist, battery cutoff (<20%), SOCKS5 proxy, and IP filter.
          files: build-artifacts/Maglev-v0.1-beta.apk
          draft: false
          prerelease: true
