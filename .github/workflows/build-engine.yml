name: Build Native Engine (librqbit)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'native/maglev-core/**'
      - '.github/workflows/build-engine.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'native/maglev-core/**'
  workflow_dispatch:

jobs:
  build-android-so:
    name: Cross-Compile libmaglev_core.so
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: x86_64-linux-android
            abi: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build stripped .so
        run: |
          cd native/maglev-core
          cargo ndk --target ${{ matrix.target }} --platform 24 build --release
          mkdir -p ../../modules/maglev-engine/android/src/main/jniLibs/${{ matrix.abi }}
          cp target/${{ matrix.target }}/release/libmaglev_core.so \
             ../../modules/maglev-engine/android/src/main/jniLibs/${{ matrix.abi }}/libmaglev_core.so

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmaglev_core-${{ matrix.abi }}
          path: modules/maglev-engine/android/src/main/jniLibs/${{ matrix.abi }}/libmaglev_core.so
          retention-days: 14

  publish-binaries:
    name: Commit & Bundle Native Binaries
    needs: build-android-so
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/jniLibs

      - name: Place binaries into jniLibs
        run: |
          mkdir -p modules/maglev-engine/android/src/main/jniLibs/arm64-v8a
          mkdir -p modules/maglev-engine/android/src/main/jniLibs/armeabi-v7a
          mkdir -p modules/maglev-engine/android/src/main/jniLibs/x86_64

          cp /tmp/jniLibs/libmaglev_core-arm64-v8a/libmaglev_core.so \
             modules/maglev-engine/android/src/main/jniLibs/arm64-v8a/libmaglev_core.so
          cp /tmp/jniLibs/libmaglev_core-armeabi-v7a/libmaglev_core.so \
             modules/maglev-engine/android/src/main/jniLibs/armeabi-v7a/libmaglev_core.so
          cp /tmp/jniLibs/libmaglev_core-x86_64/libmaglev_core.so \
             modules/maglev-engine/android/src/main/jniLibs/x86_64/libmaglev_core.so

      - name: Commit pre-built libraries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/maglev-engine/android/src/main/jniLibs/
          git commit -m "chore(native): update cloud-compiled libmaglev_core.so binaries [skip ci]" || echo "No changes to commit"
          git push origin dev || echo "Failed to push"
