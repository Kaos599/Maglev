name: CI

# Docs-only changes skip CI entirely (the README badge keeps the last real result).
on:
  # Pushes run CI only on main and dev; every other branch is covered by its pull request, so CI doesn't run twice.
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', 'screens/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'screens/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-test:
    name: Rust tests (no JNI feature)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/maglev-core

      - name: Run tests
        run: cargo test --manifest-path native/maglev-core/Cargo.toml --no-default-features

      - name: Run TLS verifier shim tests
        run: cargo test --manifest-path native/maglev-core/vendor/rustls-platform-verifier/Cargo.toml

      - name: Clippy (non-blocking)
        continue-on-error: true
        run: cargo clippy --manifest-path native/maglev-core/Cargo.toml --no-default-features -- -D warnings

  js:
    name: JS checks (typecheck, tests, assistant eval)
    runs-on: ubuntu-latest
    # Runs in parallel with the APK build (which takes far longer); a failure here still fails the run.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Tests import .ts files directly with type stripping, which needs Node 22.18 or newer.
          node-version: '22.18'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Assistant tests
        run: npm run test:assistant

      - name: Assistant eval (scripted model, no key)
        # run.js exits 1 when any check fails or a scenario errors.
        run: node scripts/eval-assistant/run.js --fake

  rust-android:
    name: Rust Android
    uses: ./.github/workflows/_rust-android.yml
    with:
      # main builds all three ABIs so release-apk.yml can reuse the APKs; other refs build arm64 only.
      abis: ${{ github.ref == 'refs/heads/main' && 'arm64-v8a,armeabi-v7a,x86_64' || 'arm64-v8a' }}

  apk:
    name: Build APK
    needs: rust-android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
      # Everyday CI builds arm64 only (plugins/withAbiSplits.js). main builds all three, and
      # release-apk.yml reuses that run's `apks` artifact (app-{universal,arm64-v8a,armeabi-v7a,x86_64}-release.apk).
      MAGLEV_ABIS: ${{ github.ref == 'refs/heads/main' && 'arm64-v8a,armeabi-v7a,x86_64' || 'arm64-v8a' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle (dependency and build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Feature branches write the cache too; the default is read-only off main.
          cache-read-only: false

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install NDK (retries a corrupt download)
        # Must match the ndkVersion React Native pins; Gradle would otherwise fetch it mid-build with no retry.
        run: |
          NDK="ndk;27.1.12297006"
          for i in 1 2 3; do
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "$NDK" >/dev/null && break
            echo "NDK install attempt $i failed, retrying"; rm -rf "$ANDROID_HOME/ndk/27.1.12297006"; sleep 15
          done
          test -f "$ANDROID_HOME/ndk/27.1.12297006/source.properties" || { echo "NDK install failed"; exit 1; }

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          pattern: jniLibs-*
          merge-multiple: true
          path: modules/maglev-engine/android/src/main/jniLibs

      - name: Verify jniLibs layout
        run: |
          for abi in ${MAGLEV_ABIS//,/ }; do
            test -f "modules/maglev-engine/android/src/main/jniLibs/$abi/libmaglev_core.so" \
              || { echo "Missing $abi/libmaglev_core.so"; find modules/maglev-engine/android/src/main/jniLibs -type f; exit 1; }
          done
          ls -l modules/maglev-engine/android/src/main/jniLibs/*/

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - name: Decode release keystore (only when the secret exists)
        # Forks and PRs have no secrets: this step is a no-op and Gradle keeps debug signing (plugins/withReleaseSigning.js).
        env:
          MAGLEV_KEYSTORE_B64: ${{ secrets.MAGLEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$MAGLEV_KEYSTORE_B64" ]; then
            (umask 077; printf '%s' "$MAGLEV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/maglev-release.jks")
            echo "MAGLEV_KEYSTORE_PATH=$RUNNER_TEMP/maglev-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded"
          else
            echo "No release keystore secret; APKs stay debug-signed"
          fi

      - name: Build release APKs
        # Passwords are given to this step only, not to every later step.
        env:
          MAGLEV_KEYSTORE_PASSWORD: ${{ secrets.MAGLEV_KEYSTORE_PASSWORD }}
          MAGLEV_KEY_ALIAS: ${{ secrets.MAGLEV_KEY_ALIAS }}
          MAGLEV_KEY_PASSWORD: ${{ secrets.MAGLEV_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK signing
        # Fails on main and tags when an APK still carries the Android debug certificate; warns elsewhere.
        # Only the public SHA-256 certificate digest is printed.
        shell: bash
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          STRICT=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then STRICT=true; fi
          BAD=0
          for apk in android/app/build/outputs/apk/release/*.apk; do
            CERTS=$("$APKSIGNER" verify --print-certs "$apk") || { echo "::error::apksigner rejected $apk"; exit 1; }
            echo "$(basename "$apk"): $(echo "$CERTS" | grep -m1 'certificate SHA-256 digest')"
            if echo "$CERTS" | grep -q 'CN=Android Debug'; then
              BAD=1
              echo "::warning::$(basename "$apk") is signed with the Android debug certificate"
            fi
          done
          if [ "$BAD" = 1 ] && [ "$STRICT" = true ]; then
            echo "::error::Debug-signed APK on main or a tag. Set the MAGLEV_KEYSTORE_* secrets (docs/RELEASE_SIGNING.md)."
            exit 1
          fi

      - name: List APKs
        run: ls -lh android/app/build/outputs/apk/release/*.apk

      - name: Verify versionCodes (base*10 + ABI digit; universal is base*10)
        shell: bash
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          BASE=$(node -p "const a=require('./app.json');(a.expo||a).android.versionCode")
          declare -A DIGIT=([universal]=0 [armeabi-v7a]=1 [x86_64]=3 [arm64-v8a]=4)
          for apk in android/app/build/outputs/apk/release/*.apk; do
            NAME=$(basename "$apk" -release.apk); ABI=${NAME#app-}
            GOT=$("$AAPT2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
            WANT=$((BASE * 10 + ${DIGIT[$ABI]}))
            echo "$NAME: versionCode $GOT (want $WANT)"
            [ "$GOT" = "$WANT" ] || { echo "::error::$NAME has versionCode $GOT, expected $WANT"; exit 1; }
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build signed APK set for Accrescent (main and tags, when signing secrets exist)
        if: env.MAGLEV_KEYSTORE_PATH != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          MAGLEV_KEYSTORE_PASSWORD: ${{ secrets.MAGLEV_KEYSTORE_PASSWORD }}
          MAGLEV_KEY_ALIAS: ${{ secrets.MAGLEV_KEY_ALIAS }}
          MAGLEV_KEY_PASSWORD: ${{ secrets.MAGLEV_KEY_PASSWORD }}
          # bundletool 1.18.3; digest matches the GitHub release page.
          BUNDLETOOL_VERSION: '1.18.3'
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          set -euo pipefail
          (cd android && ./gradlew bundleRelease --stacktrace)
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          JAR="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$JAR" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "$BUNDLETOOL_SHA256  $JAR" | sha256sum -c -
          # The AAB must carry the same scheme as the universal APK (base*10), or the APK set cannot upgrade it.
          WANT=$(( $(node -p "const a=require('./app.json');(a.expo||a).android.versionCode") * 10 ))
          GOT=$(java -jar "$JAR" dump manifest --bundle="$AAB" --xpath /manifest/@android:versionCode)
          echo "AAB versionCode $GOT (want $WANT)"
          [ "$GOT" = "$WANT" ] || { echo "::error::AAB versionCode $GOT, expected $WANT"; exit 1; }
          # bundletool takes passwords as pass: or file: only (no env:), so use 0600 files and remove them after.
          (umask 077
           printf '%s' "$MAGLEV_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.pass"
           printf '%s' "$MAGLEV_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass")
          trap 'rm -f "$RUNNER_TEMP/ks.pass" "$RUNNER_TEMP/key.pass"' EXIT
          mkdir -p apkset
          java -jar "$JAR" build-apks --bundle="$AAB" --output=apkset/maglev.apks \
            --ks="$MAGLEV_KEYSTORE_PATH" --ks-key-alias="$MAGLEV_KEY_ALIAS" \
            --ks-pass="file:$RUNNER_TEMP/ks.pass" --key-pass="file:$RUNNER_TEMP/key.pass"
          ls -lh apkset/maglev.apks

      - name: Upload APK set
        if: env.MAGLEV_KEYSTORE_PATH != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: accrescent-apks
          path: apkset/maglev.apks
          if-no-files-found: error
          retention-days: 7

      # After the upload, so a test failure never costs us the APK. AGP 9 creates host tests for debug only.
      - name: Kotlin unit tests (schedule, feed rules, restart policy)
        run: |
          cd android
          ./gradlew :maglev-engine:testDebugUnitTest --stacktrace

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: P3 reality contracts (non-blocking until P0s land)
        continue-on-error: true
        run: node scripts/test-p3-reality-contracts.js

      - name: ABI splits
        run: node scripts/test-abi-splits.js

      - name: Config plugins
        run: node scripts/test-plugins.js

      - name: Search providers (offline fixtures)
        run: node scripts/test-search.js

      - name: Feed rules (shared vectors)
        run: node scripts/test-feeds.js

      - name: Version scheme (major.minor)
        run: node scripts/test-version.js
