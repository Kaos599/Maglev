name: Checks

# Fast checks that don't need the app built: the state-machine models in specs/, and a guard against
# comments and docs that point at planning documents outside this repository.
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request makes the older run pointless. Pushes to dev and main always finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  models:
    name: Models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18'

      - name: Setup Java
        # TLC, the TLA+ model checker, runs on Java 11 or newer.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the model checker
        # check-models.js downloads tla2tools.jar into .cache/tla and checks its sha256. The key is the jar's
        # version (TLA_VERSION in that script); change both together.
        uses: actions/cache@v6
        with:
          path: .cache/tla
          key: tla-1.7.4

      - name: Check every model
        run: node scripts/check-models.js

  private-refs:
    name: No private references
    # Only pull requests into dev: that is where contributions land. A release pull request from dev to main
    # carries lines this job already checked, and older lines it would wrongly blame on the release.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The check compares this branch with where it left its base, so it needs the full history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18'

      - name: Check added lines
        # Compares with origin/dev (GITHUB_BASE_REF on a pull request, the default on a manual run).
        run: node scripts/check-private-refs.js
