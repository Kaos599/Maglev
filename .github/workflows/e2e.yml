name: E2E (Maestro, report-only)

# Runs the Maestro flows in .maestro/ on an API 34 x86_64 emulator against the APK that CI built.
# Report-only: nothing waits on this workflow, and release-apk.yml does not depend on it. Failing flows never fail the
# job (owner decision 2026-11-19), so a commit is not marked red for them. They are reported as a warning and in the
# job summary instead. Check this run after every push to main or a tag.
# CI builds x86_64 only on main (ci.yml MAGLEV_ABIS). On tags, a missing APK or unrun flows fail the job with an error;
# on other refs without an x86_64 APK, the job exits green with a warning in the summary.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run id to take the apks artifact from (default: wait for this commit''s main CI run on main/tags, or find a successful run for this commit)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  maestro:
    name: Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so git merge-base --is-ancestor and git diff can verify any docs-only fallback APK.
          fetch-depth: 0

      - name: Find the CI run and download the x86_64 APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RUN: ${{ inputs.run_id }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          ERR_LOG=$(mktemp)
          IS_TAG=0
          [[ "$REF" == refs/tags/* ]] && IS_TAG=1
          IS_MAIN_OR_TAG=0
          [[ "$REF" == "refs/heads/main" || "$IS_TAG" = "1" ]] && IS_MAIN_OR_TAG=1

          write_err_log() {
            if [ -s "$ERR_LOG" ]; then
              {
                echo ""
                echo "<details><summary>APK lookup log</summary>"
                echo ""
                echo '```'
                cat "$ERR_LOG"
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          finish_skip() {
            local reason="$1"
            {
              echo "## Maestro flows"
              echo "**No flows ran.** $reason"
            } >> "$GITHUB_STEP_SUMMARY"
            write_err_log
            if [ "$IS_TAG" = "1" ]; then
              echo "::error::No flows ran on tag $REF: $reason"
              exit 1
            fi
            echo "::warning::No flows ran: $reason"
            exit 0
          }

          try_run() {
            local r="$1"
            [ -n "$r" ] || return 1
            rm -rf ci-apks; mkdir -p ci-apks
            if ! gh run download "$r" --name apks --dir ci-apks 2>>"$ERR_LOG"; then
              echo "run $r: apks artifact download failed" >> "$ERR_LOG"
              return 1
            fi
            local found
            found=$(find ci-apks -type f -name 'app-x86_64-release.apk' | head -n 1)
            if [ -z "$found" ]; then
              echo "run $r: apks artifact has no app-x86_64-release.apk" >> "$ERR_LOG"
              return 1
            fi
            APK="$found"
            PICKED_RUN="$r"
            return 0
          }

          APK=""
          PICKED_RUN=""
          PICKED_SHA=""
          EXACT_RUN=""
          if [ -n "$INPUT_RUN" ]; then
            if ! try_run "$INPUT_RUN"; then
              finish_skip "CI run $INPUT_RUN has no live x86_64 APK."
            fi
            PICKED_SHA=$(gh run view "$PICKED_RUN" --json headSha --jq '.headSha // empty' 2>>"$ERR_LOG" || true)
          else
            # On main and v* tags, wait for this commit's own main push CI run (the tag often lands while CI is still running).
            if [ "$IS_MAIN_OR_TAG" = "1" ]; then
              for i in 1 2 3 4 5 6; do
                EXACT_RUN=$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --event push --limit 10 \
                  --json databaseId,conclusion --jq '[.[] | select(.conclusion != "cancelled")][0].databaseId // empty' 2>>"$ERR_LOG" || true)
                [ -n "$EXACT_RUN" ] && break
                echo "No ci.yml main push run for $GITHUB_SHA yet (attempt $i/6)" >> "$ERR_LOG"
                sleep 15
              done
              if [ -n "$EXACT_RUN" ]; then
                STATUS=$(gh run view "$EXACT_RUN" --json status --jq '.status // empty' 2>>"$ERR_LOG" || true)
                if [ "$STATUS" != "completed" ]; then
                  echo "Waiting up to 40 min for CI run $EXACT_RUN ($STATUS)..."
                  timeout 2400 gh run watch "$EXACT_RUN" --interval 30 >/dev/null 2>>"$ERR_LOG" || true
                fi
                read -r STATUS CONCLUSION < <(gh run view "$EXACT_RUN" --json status,conclusion --jq '[.status, .conclusion] | join(" ")' 2>>"$ERR_LOG" || echo "unknown unknown")
                if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
                  if try_run "$EXACT_RUN"; then
                    PICKED_SHA=$(gh run view "$EXACT_RUN" --json headSha --jq '.headSha // empty' 2>>"$ERR_LOG" || true)
                  else
                    finish_skip "CI run $EXACT_RUN for $GITHUB_SHA succeeded but has no live x86_64 APK."
                  fi
                else
                  echo "CI run $EXACT_RUN ended with $STATUS/$CONCLUSION" >> "$ERR_LOG"
                  finish_skip "CI run $EXACT_RUN for $GITHUB_SHA ended with $STATUS/$CONCLUSION; refusing to test an older APK."
                fi
              fi
            else
              # Non-main/non-tag manual dispatch: check completed runs for this exact commit only.
              for r in $(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 5 --json databaseId --jq '.[].databaseId' 2>>"$ERR_LOG" || true); do
                if try_run "$r"; then
                  PICKED_SHA=$(gh run view "$r" --json headSha --jq '.headSha // empty' 2>>"$ERR_LOG" || true)
                  break
                fi
              done
            fi

            # Ancestor-only fallback on main/v* tags ONLY when no ci.yml main push run exists for $GITHUB_SHA
            # (docs-only push skipped by ci.yml paths-ignore). Require that every diff since the ancestor is ignored by ci.yml.
            if [ -z "$APK" ] && [ "$IS_MAIN_OR_TAG" = "1" ] && [ -z "$EXACT_RUN" ]; then
              while read -r r sha; do
                [ -n "$r" ] && [ -n "$sha" ] || continue
                if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA" 2>/dev/null; then
                  continue
                fi
                if ! git diff --quiet "$sha" "$GITHUB_SHA" -- . ':(exclude)**/*.md' ':(exclude)docs/**' ':(exclude)screens/**' ':(exclude)LICENSE' 2>/dev/null; then
                  echo "skipping ancestor run $r ($sha): non-docs files changed since $sha" >> "$ERR_LOG"
                  continue
                fi
                if try_run "$r"; then
                  PICKED_SHA="$sha"
                  if [ "$PICKED_SHA" != "$GITHUB_SHA" ]; then
                    echo "::warning::Docs-only commit $GITHUB_SHA skipped CI; using identical ancestor APK from main run $r ($PICKED_SHA)."
                  fi
                  break
                fi
              done < <(gh run list --workflow ci.yml --branch main --event push --status success --limit 10 \
                --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"' 2>>"$ERR_LOG" || true)
            fi
          fi

          if [ -z "$APK" ]; then
            finish_skip "No successful CI run with a live x86_64 APK found for $GITHUB_SHA."
          fi
          if [ -z "$PICKED_SHA" ]; then
            echo "::warning::Could not read headSha for CI run $PICKED_RUN."
          fi
          write_err_log
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "run_id=$PICKED_RUN" >> "$GITHUB_OUTPUT"
          echo "run_sha=$PICKED_SHA" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        if: steps.apk.outputs.apk != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        if: steps.apk.outputs.apk != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        if: steps.apk.outputs.apk != ''
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run flows on the emulator
        id: flows
        if: steps.apk.outputs.apk != ''
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # More memory and no window: the runner's default emulator is short on RAM, which freezes the Pixel Launcher
          # and puts an "isn't responding" dialog over the app (every flow failed on 2026-11-18 because of it).
          ram-size: 4096M
          cores: 4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell input keyevent KEYCODE_HOME
            adb install -r "${{ steps.apk.outputs.apk }}"
            maestro test .maestro/ --format junit --output maestro-report.xml --debug-output maestro-debug --flatten-debug-output || (adb logcat -d > maestro-logcat.txt; exit 1)

      - name: Report the result
        if: always() && steps.apk.outputs.apk != ''
        env:
          OUTCOME: ${{ steps.flows.outcome }}
          RUN_ID: ${{ steps.apk.outputs.run_id }}
          RUN_SHA: ${{ steps.apk.outputs.run_sha }}
          REF: ${{ github.ref }}
        run: |
          IS_TAG=0
          [[ "$REF" == refs/tags/* ]] && IS_TAG=1
          {
            echo "## Maestro flows"
            echo "APK from CI run \`$RUN_ID\` (commit \`${RUN_SHA:-unknown}\`)."
            if [ -n "$RUN_SHA" ] && [ "$RUN_SHA" != "$GITHUB_SHA" ]; then
              echo "> Note: tested APK commit \`$RUN_SHA\` differs from ref commit \`$GITHUB_SHA\` (docs-only diff verified)."
            fi
            echo ""
            if [ ! -f maestro-report.xml ]; then
              echo "**Flows did not run.** No \`maestro-report.xml\` was produced (emulator boot or \`adb install\` failed)."
            elif [ "$OUTCOME" = "success" ]; then
              echo "All flows passed."
            else
              echo "**Some flows failed.** See the maestro-output artifact (report, screenshots, logcat)."
            fi
            if [ -f maestro-report.xml ]; then
              echo ""
              grep -o '<testcase [^>]*name="[^"]*"' maestro-report.xml | sed 's/.*name="\([^"]*\)"/- \1/' || true
              FAILED=$(grep -c '<failure' maestro-report.xml || true)
              echo ""
              echo "Failed flows: ${FAILED:-0}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f maestro-report.xml ]; then
            if [ "$IS_TAG" = "1" ]; then
              echo "::error::Flows did not run on tag $REF (maestro-report.xml missing)."
              exit 1
            fi
            echo "::warning title=Maestro flows did not run::No maestro-report.xml was produced."
          elif [ "$OUTCOME" != "success" ]; then
            echo "::warning title=Maestro flows failed::Report-only. Open this run's summary and the maestro-output artifact."
          fi

      - name: Upload Maestro output
        if: always() && steps.apk.outputs.apk != ''
        uses: actions/upload-artifact@v7
        with:
          name: maestro-output
          path: |
            maestro-report.xml
            maestro-debug/
            maestro-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
