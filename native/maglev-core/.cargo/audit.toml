# cargo audit settings (read from this folder by the Security audit workflow).
[advisories]
ignore = [
  # RUSTSEC-2026-0293: ringbuf < 0.5.2, Consumer::skip/clear double-drop when an element's Drop panics.
  # Pulled in by librqbit-utp 0.7.0 (newest release), which only stores u8 (SharedRb<Heap<u8>>, stream_tx.rs).
  # u8 has no Drop, so the bug can't happen here. Remove this line once librqbit-utp moves to ringbuf >= 0.5.2.
  "RUSTSEC-2026-0293",
]
