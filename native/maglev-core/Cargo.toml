[package]
name = "maglev-core"
version = "0.1.0"
edition = "2021"
authors = ["Maglev Team"]
description = "Native BitTorrent engine for Maglev powered by librqbit"

[lib]
name = "maglev_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
librqbit = { version = "8.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2.0"
bytes = "1.10"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
libc = "0.2"

[features]
default = ["jni-bridge"]
jni-bridge = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
