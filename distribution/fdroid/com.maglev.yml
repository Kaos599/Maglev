# DRAFT fdroiddata recipe for Maglev. Copy to fdroiddata/metadata/com.maglev.yml.
# Read distribution/fdroid/NOTES.md first: v0.19-beta will not build cleanly until the blockers there are fixed.
# Sources used: https://f-droid.org/docs/Build_Metadata_Reference/
#   https://f-droid.org/2020/10/14/adding-react-native-app-to-f-droid.html
#   https://gitlab.com/fdroid/fdroiddata/-/blob/master/templates/build-react-native.yml
#   https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/com.trougnouf.cfait.yml (cargo-ndk)
#   https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/rs.ruffle.yml (cargo-ndk + binary:)
AntiFeatures:
  NonFreeNet:
    en-US: The optional assistant sends requests to OpenRouter, Groq or Anthropic,
      which are closed services.
Categories:
  - Internet
  - Multimedia
License: GPL-3.0-only
AuthorName: Kaos599
WebSite: https://github.com/Kaos599/Maglev
SourceCode: https://github.com/Kaos599/Maglev
IssueTracker: https://github.com/Kaos599/Maglev/issues
Changelog: https://github.com/Kaos599/Maglev/releases

AutoName: Maglev

RepoType: git
Repo: https://github.com/Kaos599/Maglev.git

Builds:
  - versionName: '0.19'
    versionCode: 191
    commit: v0.19-beta
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev openjdk-17-jdk-headless
      - update-alternatives --auto java
      - curl -Lo node.tar.gz https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.gz
      - echo "c54118104acc524633b5abe106bbf44a53126ec8b4e5fa105cb92b5d7de8a1a1  node.tar.gz"
        | sha256sum -c -
      - tar xzf node.tar.gz --strip-components=1 -C /usr/local/
    init: npm ci --legacy-peer-deps --ignore-scripts
    output: android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: https://github.com/Kaos599/Maglev/releases/download/v%v-beta/Maglev-v%v-beta-armeabi-v7a.apk
    srclibs:
      - rustup@1.28.2
    prebuild:
      - export EXPO_NO_TELEMETRY=1
      - export MAGLEV_ABIS=armeabi-v7a
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - npx expo prebuild --platform android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - android/build.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/react-native-reanimated/android/build.gradle
      - node_modules/react-native-worklets/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-gesture-handler/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules
    build:
      - export CARGO_HOME=$HOME/.cargo
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.91.1 --profile minimal
        --target armv7-linux-androideabi
      - source $HOME/.cargo/env
      - cargo install --locked cargo-ndk@4.1.2
      - cd ../../native/maglev-core
      - export ANDROID_NDK_HOME=$$NDK$$
      - export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,--build-id=none
        --remap-path-prefix $(pwd)=/maglev --remap-path-prefix $HOME/.cargo=/cargo"
      - cargo ndk --target armeabi-v7a --platform 24 -o ../../modules/maglev-engine/android/src/main/jniLibs
        build --release
      - cd ../../android
      - ./gradlew assembleRelease --no-daemon
    ndk: 27.1.12297006

